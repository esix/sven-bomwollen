; Date: 25.09.2001


; === Changes ===
; 25.09.2001 - New terrain added (a); used as a teleporting destination
; 21.09.2001 - New characters entered (flowers)
; 07.09.2001 - New walkable cells entered: (_) and (.); used to border some bushes; 
;	cannot walk from such a cell to another one of the same type
; 14.08.2001 - New cell terrain: puddles (p)
; 12.07.2001 - New section [Terrain] entered. Play area extended.


; === Map parameters (size and position) ===
; Do not change!
[MapInfo]
Rows=12
Cols=16
Origin=-213,310
CellWidth=40,-30
CellHeight=39,30


; === Terrain ===
; # = inaccessible cell (bush, tree, water etc)
; _ = special cell (accessible). Cannot walk from such a cell to another cell of the same type
; . =    "      "        "          "     "    "    "      "        "      "      "    "    "
; c = cliffs
; p = puddle (teleporters)
; a = teleporting destinations

; === Characters ===
; e,n,w,s = sheeps oriented to the top-right, top-left, bottom-left and bottom-right corner
; W,S = one special sheep, oriented as explained above
; m = man (shepherd)
; d = dog
; f = Sven (the fucker)
 
; === Flowers and mushrooms (power-ups)
; t = slow down (gray mushroom)
; u = come home with flowers (flower)
; v = spanish fly mode (red mushroom) 
; x = surprise (rainbow mushroom)
; y = instant happy (blue mushroom)
; z = bad weather (black mushroom)

; === Terrain map ===
; No characters on this terrain map. Only the terrain.
; This map shows the terrain and it overrides any 
; terrain setting on any level map. 
[Terrain]
Row00=#####& ##&&#####
Row01=####&  p   &####
Row02=###&       p&###
Row03=##&  a        &#
Row04=#&         __  #
Row05=&         a __ #
Row06=& p         .. #
Row07=#&           . &
Row08=#&# a         &#
Row09=##&#       a &##
Row10=##&###c     &###
Row11=#######cccc&####


